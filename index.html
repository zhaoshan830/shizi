<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>四岁半 · 识字闯关</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #fde9e0 0%, #f9d8c6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 700px;
      background: #fffef7;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #ffeacb;
      position: relative;
    }

    /* 声音激活遮罩层 */
    #audio-mask {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 240, 220, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    
    #audio-mask h2 {
      color: #d14b4b;
      font-size: 2rem;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }

    #audio-mask button {
      background: #ff9f43;
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.5rem;
      border-radius: 50px;
      font-weight: bold;
      box-shadow: 0 8px 0 #cc7a2c;
      cursor: pointer;
    }
    
    #audio-mask button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #cc7a2c;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .header-area {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .progress-badge {
      background: #ffb882;
      border-radius: 60px;
      padding: 6px 18px;
      color: #4a2c1a;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: inset 0 -3px 0 #b46f3a;
    }

    .mode-indicator {
      background: #e3d1bd;
      padding: 6px 16px;
      border-radius: 30px;
      color: #4b3621;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: inset 0 -2px 0 #b39a7e;
    }

    .play-again-btn {
      background: #ffddb0;
      border-radius: 50px;
      padding: 12px 30px;
      margin-bottom: 24px;
      color: #573f2e;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 6px 0 #c29b6b;
      transition: all 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-again-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #c29b6b;
    }

    .play-again-btn .icon {
      font-size: 1.8rem;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .char-btn {
      background: #ffffff;
      border: 4px solid #fbc28b;
      border-radius: 24px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 700;
      color: #3f2a18;
      box-shadow: 0 8px 0 #dba56b, 0 6px 12px rgba(0, 0, 0, 0.1);
      transition: all 0.1s;
      cursor: pointer;
    }

    .char-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #dba56b, 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); background: #c8f0c8; border-color: #73c973; }
      100% { transform: scale(1); }
    }
    .char-btn.correct {
      animation: pop 0.4s;
      background: #e6ffe6;
      border-color: #73c973;
      box-shadow: 0 4px 0 #5fa55f;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .char-btn.wrong {
      animation: shake 0.3s;
      background: #ffe6e6;
      border-color: #ff7a7a;
      box-shadow: 0 4px 0 #d14b4b;
    }

    .reset-btn {
      margin-top: 30px;
      background: none;
      border: none;
      font-size: 2rem;
      padding: 10px;
      cursor: pointer;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .app-container { padding: 16px 12px; }
      .grid-container { gap: 10px; }
      .char-btn { font-size: 2.8rem; border-radius: 16px; }
      .play-again-btn { font-size: 1rem; padding: 10px 20px; }
    }
  </style>
</head>
<body>

  <!-- 关键：声音激活遮罩层，必须点一下才能出声 -->
  <div id="audio-mask">
    <h2>👆 请点击下方按钮开启声音</h2>
    <button id="start-btn">点击开始游戏</button>
  </div>

  <div class="app-container">
    <div class="header-area">
      <div class="progress-badge" id="progressBadge">第 1 题</div>
      <div class="mode-indicator" id="modeIndicator">👂 听音找字</div>
    </div>

    <div class="play-again-btn" id="playBtn">
      <span class="icon">🔊</span>
      <span>点我重听</span>
    </div>

    <div class="grid-container" id="gridContainer"></div>

    <button class="reset-btn" id="resetBtn" aria-label="重新开始">🔄</button>
  </div>

  <script>
    (function() {
      // 生字库
      const GRADE_DATA = [
        { text: '大' }, { text: '小' }, { text: '人' }, { text: '山' }, { text: '水' }, 
        { text: '火' }, { text: '日' }, { text: '月' }, { text: '口' }, { text: '手' }, 
        { text: '猫' }, { text: '狗' }, { text: '花' }, { text: '鸟' }, { text: '天' }, 
        { text: '上' }, { text: '下' }, { text: '我' }, { text: '你' }, { text: '好' },
        { text: '太' }, { text: '早' }, { text: '牙' }, { text: '木' }, { text: '马' }
      ];

      const uniqueMap = new Map();
      GRADE_DATA.forEach(item => uniqueMap.set(item.text, item));
      const wordPool = Array.from(uniqueMap.values());

      let currentTargetWord = null;
      let currentGridWords = [];
      let level = 1;
      let isLocked = false;
      let isAudioReady = false; // 声音是否已激活

      const gridContainer = document.getElementById('gridContainer');
      const playBtn = document.getElementById('playBtn');
      const progressBadge = document.getElementById('progressBadge');
      const resetBtn = document.getElementById('resetBtn');
      
      const audioMask = document.getElementById('audio-mask');
      const startBtn = document.getElementById('start-btn');

      // 语音引擎核心逻辑
      function speak(text) {
        if (!isAudioReady) return;
        if (!window.speechSynthesis) {
          alert('您的浏览器不支持语音朗读，请使用 Chrome、Safari 或 Edge 浏览器打开。');
          return;
        }
        
        // 有些手机浏览器必须要在用户交互后且不打断的情况下才发声
        window.speechSynthesis.cancel(); 
        
        const utterance = new SpeechSynthesisUtterance();
        utterance.text = text;
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85; 
        utterance.pitch = 1.1;
        
        const voices = window.speechSynthesis.getVoices();
        // 尽量找中文语音
        const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Chinese'));
        if (zhVoice) {
          utterance.voice = zhVoice;
        }
        
        window.speechSynthesis.speak(utterance);
      }

      // 生成新题目
      function generateNewRound() {
        if (isLocked) return;
        
        const shuffledPool = [...wordPool].sort(() => Math.random() - 0.5);
        currentGridWords = shuffledPool.slice(0, 6);
        
        const randomIndex = Math.floor(Math.random() * 6);
        currentTargetWord = currentGridWords[randomIndex];

        renderGrid();
        progressBadge.textContent = `第 ${level} 题`;
        
        setTimeout(() => {
          speak(currentTargetWord.text);
        }, 300);
      }

      function renderGrid() {
        gridContainer.innerHTML = '';
        currentGridWords.forEach(wordObj => {
          const btn = document.createElement('div');
          btn.classList.add('char-btn');
          btn.textContent = wordObj.text;
          
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleCardClick(wordObj.text, btn);
          });
          gridContainer.appendChild(btn);
        });
      }

      function handleCardClick(clickedText, btnElement) {
        if (isLocked) return;

        if (clickedText === currentTargetWord.text) {
          isLocked = true;
          btnElement.classList.add('correct');
          speak(clickedText);
          
          setTimeout(() => {
            level++;
            isLocked = false;
            document.querySelectorAll('.char-btn').forEach(b => {
              b.classList.remove('correct', 'wrong');
            });
            generateNewRound();
          }, 1000);
        } else {
          btnElement.classList.add('wrong');
          if (navigator.vibrate) navigator.vibrate(200);
          setTimeout(() => {
            btnElement.classList.remove('wrong');
          }, 400);
        }
      }

      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentTargetWord) speak(currentTargetWord.text);
      });

      function resetGame() {
        level = 1;
        isLocked = false;
        window.speechSynthesis?.cancel();
        generateNewRound();
      }

      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetGame();
      });

      // ============================================================
      // 核心突破：点击开始按钮，强行激活手机的声音权限
      // ============================================================
      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // 1. 预加载语音列表
        if (window.speechSynthesis) {
          window.speechSynthesis.getVoices();
          // 2. 随便播报一个空字符或很短的声音，把手机的音频通道“骗”开
          const u = new SpeechSynthesisUtterance(' ');
          u.volume = 0.1; 
          window.speechSynthesis.speak(u);
        }

        // 3. 标记声音已准备
        isAudioReady = true;

        // 4. 隐藏遮罩层，开始游戏
        audioMask.style.display = 'none';
        generateNewRound();
      });

      // 初始化语音列表加载
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          // 语音包加载完成
        };
      }

    })();
  </script>
</body>
</html>
