<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>四岁半 · 识字闯关</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #fde9e0 0%, #f9d8c6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 700px;
      background: #fffef7;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #ffeacb;
    }

    /* 进度与状态 */
    .header-area {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 10px;
    }

    .progress-badge {
      background: #ffb882;
      border-radius: 60px;
      padding: 6px 18px;
      color: #4a2c1a;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: inset 0 -3px 0 #b46f3a;
    }

    .mode-indicator {
      background: #e3d1bd;
      padding: 6px 16px;
      border-radius: 30px;
      color: #4b3621;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: inset 0 -2px 0 #b39a7e;
    }

    /* 喇叭重听按钮 */
    .play-again-btn {
      background: #ffddb0;
      border-radius: 50px;
      padding: 12px 30px;
      margin-bottom: 24px;
      color: #573f2e;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 6px 0 #c29b6b;
      transition: all 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-again-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #c29b6b;
    }

    .play-again-btn .icon {
      font-size: 1.8rem;
    }

    /* 6个字的网格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    /* 字卡按钮 */
    .char-btn {
      background: #ffffff;
      border: 4px solid #fbc28b;
      border-radius: 24px;
      aspect-ratio: 1 / 1; /* 正方形卡片 */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 700;
      color: #3f2a18;
      box-shadow: 0 8px 0 #dba56b, 0 6px 12px rgba(0, 0, 0, 0.1);
      transition: all 0.1s;
      cursor: pointer;
    }

    .char-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #dba56b, 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    /* 正确动画 */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); background: #c8f0c8; border-color: #73c973; }
      100% { transform: scale(1); }
    }
    .char-btn.correct {
      animation: pop 0.4s;
      background: #e6ffe6;
      border-color: #73c973;
      box-shadow: 0 4px 0 #5fa55f;
    }

    /* 错误动画 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .char-btn.wrong {
      animation: shake 0.3s;
      background: #ffe6e6;
      border-color: #ff7a7a;
      box-shadow: 0 4px 0 #d14b4b;
    }

    .reset-btn {
      margin-top: 30px;
      background: none;
      border: none;
      font-size: 2rem;
      padding: 10px;
      cursor: pointer;
      opacity: 0.6;
    }

    /* 手机适配 */
    @media (max-width: 480px) {
      .app-container {
        padding: 16px 12px;
      }
      .grid-container {
        gap: 10px;
      }
      .char-btn {
        font-size: 2.8rem;
        border-radius: 16px;
      }
      .play-again-btn {
        font-size: 1rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header-area">
      <div class="progress-badge" id="progressBadge">第 1 题</div>
      <div class="mode-indicator" id="modeIndicator">👂 听音找字</div>
    </div>

    <!-- 核心：先出6个字，点这里重听发音 -->
    <div class="play-again-btn" id="playBtn">
      <span class="icon">🔊</span>
      <span>点我重听</span>
    </div>

    <!-- 6个字网格 -->
    <div class="grid-container" id="gridContainer">
      <!-- JS动态生成 -->
    </div>

    <button class="reset-btn" id="resetBtn" aria-label="重新开始">🔄</button>
  </div>

  <script>
    (function() {
      // ============================================================
      // 【生字库】把你需要的字加在这里，格式 { text: '字' }
      // ============================================================
      const GRADE_DATA = [
        // 一年级示例（请按需补充）
        { text: '大' }, { text: '小' }, { text: '人' }, { text: '山' }, { text: '水' }, 
        { text: '火' }, { text: '日' }, { text: '月' }, { text: '口' }, { text: '手' }, 
        { text: '猫' }, { text: '狗' }, { text: '花' }, { text: '鸟' }, { text: '天' }, 
        { text: '上' }, { text: '下' }, { text: '我' }, { text: '你' }, { text: '好' },
        { text: '太' }, { text: '早' }, { text: '牙' }, { text: '木' }, { text: '马' },
        { text: '春' }, { text: '雨' }, { text: '芽' }, { text: '布' }, { text: '谷' },
        
        // 你可以继续往下加二三四五年级的字...
        { text: '秋' }, { text: '烟' }, { text: '芦' }, { text: '夕' }, { text: '桥' },
        { text: '周' }, { text: '排' }, { text: '洒' }, { text: '塔' }, { text: '墙' },
        { text: '崇' }, { text: '浸' }, { text: '项' }, { text: '劳' }, { text: '涌' },
        { text: '叨' }, { text: '姥' }, { text: '滋' }, { text: '纸' }, { text: '恍' }
      ];

      // 去除重复字并生成最终字库
      const uniqueMap = new Map();
      GRADE_DATA.forEach(item => uniqueMap.set(item.text, item));
      const wordPool = Array.from(uniqueMap.values());

      // ============================================================
      // 游戏状态
      // ============================================================
      let currentTargetWord = null; // 当前要求找的字
      let currentGridWords = [];    // 当前屏幕上的6个字
      let level = 1;
      let isLocked = false;         // 防止连续点击

      // DOM 元素
      const gridContainer = document.getElementById('gridContainer');
      const playBtn = document.getElementById('playBtn');
      const progressBadge = document.getElementById('progressBadge');
      const resetBtn = document.getElementById('resetBtn');
      const modeIndicator = document.getElementById('modeIndicator');

      // ============================================================
      // 语音朗读功能
      // ============================================================
      function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85; // 语速稍慢适合孩子
        utterance.pitch = 1.1;
        
        // 尝试选择中文语音
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
        if (zhVoice) utterance.voice = zhVoice;
        
        window.speechSynthesis.speak(utterance);
      }

      // ============================================================
      // 核心逻辑：生成新题目
      // ============================================================
      function generateNewRound() {
        if (isLocked) return;
        
        // 1. 随机抽取6个不同的字作为选项
        // 打乱字库，取前6个
        const shuffledPool = [...wordPool].sort(() => Math.random() - 0.5);
        currentGridWords = shuffledPool.slice(0, 6);
        
        // 2. 从这6个字里随机选一个作为“目标发音字”
        const randomIndex = Math.floor(Math.random() * 6);
        currentTargetWord = currentGridWords[randomIndex];

        // 3. 更新UI
        renderGrid();
        progressBadge.textContent = `第 ${level} 题`;
        
        // 4. 自动朗读目标字 (延迟一点点，等UI渲染完)
        setTimeout(() => {
          speak(currentTargetWord.text);
        }, 300);
      }

      // 渲染6个字的网格
      function renderGrid() {
        gridContainer.innerHTML = '';
        currentGridWords.forEach(wordObj => {
          const btn = document.createElement('div');
          btn.classList.add('char-btn');
          btn.textContent = wordObj.text;
          
          // 点击事件
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleCardClick(wordObj.text, btn);
          });

          gridContainer.appendChild(btn);
        });
      }

      // ============================================================
      // 处理点击卡片
      // ============================================================
      function handleCardClick(clickedText, btnElement) {
        if (isLocked) return;

        if (clickedText === currentTargetWord.text) {
          // 答对了
          isLocked = true;
          btnElement.classList.add('correct');
          // 答对也可以再读一遍加深印象
          speak(clickedText);
          
          // 延迟后进入下一题
          setTimeout(() => {
            level++;
            isLocked = false;
            // 清除所有卡片的动画
            document.querySelectorAll('.char-btn').forEach(b => {
              b.classList.remove('correct', 'wrong');
            });
            generateNewRound();
          }, 1000);
        } else {
          // 答错了
          btnElement.classList.add('wrong');
          if (navigator.vibrate) navigator.vibrate(200);
          
          // 震动的动画结束后移除类名
          setTimeout(() => {
            btnElement.classList.remove('wrong');
          }, 400);
        }
      }

      // ============================================================
      // 重听按钮逻辑
      // ============================================================
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentTargetWord) {
          speak(currentTargetWord.text);
        }
      });

      // ============================================================
      // 重置游戏
      // ============================================================
      function resetGame() {
        level = 1;
        isLocked = false;
        window.speechSynthesis?.cancel();
        generateNewRound();
      }

      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetGame();
      });

      // 初始化首次点击加载语音包
      document.body.addEventListener('touchstart', function once() {
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
        document.body.removeEventListener('touchstart', once);
      }, { once: true });
      document.body.addEventListener('click', function once() {
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
        document.body.removeEventListener('click', once);
      }, { once: true });

      // ============================================================
      // 启动游戏
      // ============================================================
      // 初始化第一题（注意：部分浏览器限制自动播放，可能需要用户点一下屏幕才会朗读）
      generateNewRound();

    })();
  </script>
</body>
</html>
